<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>New Tab</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <canvas id="map" aria-hidden="true"></canvas>
  <div id="pins" aria-hidden="true"></div>

  <button id="readout" class="readout is-hidden" type="button">
    <span class="shift">Now</span><span class="when"></span>
  </button>

  <div id="dock">
    <div id="scrub" class="scrub glass is-hidden">
      <div class="track">
        <div class="rail"><div class="ticks"></div><div id="scrub-fill" class="fill"></div></div>
        <input id="slider" type="range" min="-24" max="24" step="1" value="0" aria-label="Shift time in 30 minute steps">
      </div>
      <div class="scale" aria-hidden="true">
        <span>&minus;12h</span><span>&minus;6h</span><span>Now</span><span>+6h</span><span>+12h</span>
      </div>
    </div>
    <button id="edit-button" class="edit-button glass is-hidden" type="button" aria-label="Edit cities">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13.6 3.6a1.8 1.8 0 0 1 2.6 2.6l-8.9 8.9-3.4.8.8-3.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>Edit</span>
    </button>
  </div>

  <dialog id="editor" aria-labelledby="editor-title">
    <div class="sheet">
      <header class="sheet-head">
        <h1 id="editor-title">Cities <span id="city-count" class="count"></span></h1>
        <button class="done" type="button">Done</button>
      </header>

      <div class="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12.6 12.6 17 17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <input id="search" type="text" placeholder="Add a city, e.g. Lisbon or Austin, TX" autocomplete="off" spellcheck="false"
               role="combobox" aria-autocomplete="list" aria-controls="results" aria-expanded="false">
      </div>
      <ul id="results" class="results" role="listbox" hidden></ul>
      <p id="search-status" class="search-status" hidden></p>

      <ul id="city-list" class="city-list"></ul>
      <p id="empty-list" class="empty" hidden>No cities yet. Search above to add one.</p>

      <footer class="sheet-foot">
        <div class="setting">
          <span class="setting-label">Time format</span>
          <div class="segmented" role="radiogroup" aria-label="Time format">
            <label><input type="radio" name="time-format" value="auto"><span>Auto <small id="auto-hint"></small></span></label>
            <label><input type="radio" name="time-format" value="12"><span>12-hour</span></label>
            <label><input type="radio" name="time-format" value="24"><span>24-hour</span></label>
          </div>
        </div>
        <p class="credits">Imagery: NASA Earth Observatory (Blue Marble, Black Marble). Places: GeoNames, CC BY 4.0.</p>
      </footer>
    </div>
  </dialog>
</body>
</html>
